# SHA256 (Inhalt ab Zeile 2, d.h. dieser Datei ohne diese erste Zeile): 9d606500d5c53944573867b33762ad6ffe94d6562cb5dfa05367b28087be0ece
alias: Schrittziel erreicht
description: Meldung, wenn ein Profil sein Tagesziel erreicht (Ereignis health_center_goal_reached)
triggers:
  - trigger: event
    event_type: health_center_goal_reached
    event_data:
      metric: steps
actions:
  - action: persistent_notification.create
    data:
      title: Ziel erreicht
      message: "{{ trigger.event.data.profile }} hat {{ trigger.event.data.value }} Schritte erreicht."
